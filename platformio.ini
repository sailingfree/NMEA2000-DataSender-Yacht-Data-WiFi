; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32dev]
board = esp32dev
platform = espressif32@5.2.0
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
				~/Arduino/libraries/
                C:\Users\peter\Nextcloud\Arduino\libraries
                
monitor_speed = 115200
upload_speed = 460800
lib_ignore = 	FreeRTOS 
				lv_arduino

lib_deps =  https://github.com/Bodmer/TFT_eSPI.git
			lvgl
			https://github.com/igorantolic/ai-esp32-rotary-encoder.git


monitor_filters = esp32_exception_decoder
			
build_flags = 
	;; This include path forces the compiler to use the local pins_arduino.h
	;; which has got the correct pins for the SPI for the sdcard
	-I${PROJECT_SRC_DIR}

	;; Optimise for space and speed
	-Os
	-Ofast

	;; defines for TFT_eSPI - replaces user_Setup.h and overrides some in ILI9486_Defines.h
	'-U TFT_WIDTH'
	'-U TFT_HEIGHT'

	-D USER_SETUP_ID=11
	-D TFT_ROTATION=LV_DISPLAY_ROTATION_90
	
	-D RPI_DISPLAY_TYPE
	-D ILI9486_DRIVER

	-D TFT_MISO=26
	-D TFT_MOSI=27
	-D TFT_SCLK=33
	-D TFT_CS=32  ; Chip select control pin
	-D TFT_DC=14  ; Data Command control pin
	-D TFT_RST=25  ; Reset pin (could connect to RST pin)
	-D TOUCH_CS=SCL     ; Chip select pin (T_CS) of touch screen

	-D LOAD_GLCD   ; Font 1. Original Adafruit 8 pixel font needs ~1820 bytes in FLASH
	-D LOAD_FONT2  ; Font 2. Small 16 pixel high font, needs ~3534 bytes in FLASH, 96 characters
	-D LOAD_FONT4  ; Font 4. Medium 26 pixel high font, needs ~5848 bytes in FLASH, 96 characters
	-D LOAD_FONT6  ; Font 6. Large 48 pixel font, needs ~2666 bytes in FLASH, only characters 1234567890:-.apm
	-D LOAD_FONT7  ; Font 7. 7 segment 48 pixel font, needs ~2438 bytes in FLASH, only characters 1234567890:.
	-D LOAD_FONT8  ; Font 8. Large 75 pixel font needs ~3256 bytes in FLASH, only characters 1234567890:-.
	-D LOAD_GFXFF  ; FreeFonts. Include access to the 48 Adafruit_GFX free fonts FF1 to FF48 and custom fonts
	-D SMOOTH_FONT


	-D SPI_FREQUENCY=12000000 ; Some displays will operate at higher frequencies

	-D SPI_TOUCH_FREQUENCY=2500000   ;; 2.5MHz touch SPI clock

	-D USER_SETUP_LOADED=1


	;; Get lots of warnings
    -Wall

	;; But allow casts for c++ enums
	-Wno-strict-aliasing

;;	-DLV_USE_SCALE=1
	;; This include path forces the compiler to use the local 
	;; User_Setup.h file
    -I${PROJECT_SRC_DIR}

    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    #'-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG'
    #'-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE'
    '-D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h'

; For the custom font
	-DLV_LVGL_H_INCLUDE_SIMPLE=1
	
